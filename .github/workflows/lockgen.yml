name: Temporary Lock Generator

on:
  push:
    branches:
      - feat/distributed-ha-v2

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Emit lockfile
        run: |
          echo HELIX_LOCKFILE_BEGIN
          base64 -w 0 pnpm-lock.yaml
          echo
          echo HELIX_LOCKFILE_END
