name: Helix CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HELIX_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/helix_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d helix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Configure pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node-22-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-22-pnpm-${{ env.PNPM_VERSION }}-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
