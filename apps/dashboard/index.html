<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helix Control Plane</title>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#101b2e; --panel2:#14243b; --ink:#e7eef9; --muted:#91a4bc; --accent:#36d1b4; --warn:#f3b760; --bad:#ff7d88; --line:#243752; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 10% 0%,#142845 0,#09111f 42%); color:var(--ink); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    header { padding:28px 36px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-end; gap:20px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.03em; } h2 { margin:0 0 14px; font-size:16px; } p { margin:4px 0; color:var(--muted); }
    .eyebrow { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.13em; font-size:11px; } .status { display:flex; align-items:center; gap:8px; color:var(--muted); } .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px var(--accent); }
    main { max-width:1440px; margin:0 auto; padding:28px 36px 48px; } .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:20px; } .wide { grid-column:span 2; }
    .card { background:linear-gradient(145deg,var(--panel),#0d1728); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 12px 40px #0003; } .metric { font-size:28px; font-weight:750; margin-top:6px; } .label { color:var(--muted); font-size:12px; }
    .section { margin-top:20px; } .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:9px 8px; border-bottom:1px solid #1e3049; vertical-align:top; } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; } td { font-size:13px; }
    .pill { display:inline-flex; border-radius:999px; padding:2px 8px; background:var(--panel2); color:var(--muted); font-size:11px; } .pill.ok { color:var(--accent); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; } .empty { color:var(--muted); padding:14px 0; } .error { color:var(--bad); white-space:pre-wrap; }
    @media (max-width:900px) { header,main { padding-left:18px; padding-right:18px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .wide { grid-column:span 2; } } @media (max-width:560px) { header { align-items:flex-start; flex-direction:column; } .grid { grid-template-columns:1fr; } .wide { grid-column:span 1; } }
  </style>
</head>
<body>
  <header><div><div class="eyebrow">Helix / M16</div><h1>Production control plane</h1><p>Live operator view backed by the governed runtime APIs.</p></div><div class="status"><span class="dot"></span><span id="updated">Loading live state…</span></div></header>
  <main><div id="error" class="error"></div><section class="grid" id="cards"></section><section class="section grid"><div class="card wide"><div class="section-head"><h2>Agents</h2><span class="label" id="agent-count"></span></div><div id="agents"></div></div><div class="card wide"><div class="section-head"><h2>Federation nodes</h2><span class="label" id="node-count"></span></div><div id="nodes"></div></div><div class="card wide"><div class="section-head"><h2>Tasks and executions</h2><span class="label" id="task-count"></span></div><div id="tasks"></div></div><div class="card wide"><div class="section-head"><h2>Recent events</h2><span class="label">bounded history</span></div><div id="events"></div></div></section></main>
  <script>
    const API = localStorage.getItem('HELIX_API') || '';
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pill = (value) => { const text = String(value ?? 'unknown'); const cls = /completed|healthy|idle|PASS|ready|running/i.test(text) ? 'ok' : /failed|offline|denied|cancelled|FAIL/i.test(text) ? 'bad' : /warn|drain|busy|pending/i.test(text) ? 'warn' : ''; return `<span class="pill ${cls}">${esc(text)}</span>`; };
    const table = (headers, rows) => rows.length ? `<table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((v) => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<div class="empty">No live records reported.</div>';
    async function get(path) { const response = await fetch(`${API}/api/v1${path}`); if (!response.ok) throw new Error(`API ${response.status}`); return response.json(); }
    async function load() { try { const [status, health, events] = await Promise.all([get('/control/status'), get('/control/health'), get('/control/events?limit=12')]); const activeWorkers = status.workers.filter((w) => w.status === 'busy').length; const runningTasks = status.tasks.filter((t) => ['running','ready'].includes(t.status)).length; const completed = status.tasks.filter((t) => t.status === 'completed').length; const successRate = status.tasks.length ? Math.round(completed / status.tasks.length * 100) : 0; document.querySelector('#updated').textContent = `Updated ${new Date(status.generatedAt).toLocaleTimeString()} · ${health.status}`; document.querySelector('#cards').innerHTML = [['Agents',status.agents.length,'registered'],['Active workers',activeWorkers,'current leases'],['Queued tasks',status.queue.depth,'ready or pending'],['Running tasks',runningTasks,'live queue'],['Success rate',`${successRate}%`,`${completed}/${status.tasks.length} completed`],['Federation nodes',status.nodes.length,`${status.federation.metrics.nodesHealthy} healthy`],['Swarms',status.swarms.length,'control-plane state'],['Memory',status.memory.total,'durable entries']].map(([label,value,detail]) => `<div class="card"><div class="label">${esc(label)}</div><div class="metric">${esc(value)}</div><div class="label">${esc(detail)}</div></div>`).join(''); document.querySelector('#agent-count').textContent = `${status.agents.length} profiles`; document.querySelector('#agents').innerHTML = table(['Agent','Role','Status','Capabilities'], status.agents.slice(0,12).map((a) => [esc(a.name),esc(a.role),pill(a.status),esc(a.capabilities.slice(0,4).join(' · '))])); document.querySelector('#node-count').textContent = `${status.nodes.length} nodes`; document.querySelector('#nodes').innerHTML = table(['Node','Role','Status','Trust','Load'], status.nodes.map((n) => [esc(n.name),esc(n.role),pill(n.status),pill(n.trustLevel),esc(n.health?.load ?? '—')])); document.querySelector('#task-count').textContent = `${status.tasks.length} tasks · ${status.executions.length} executions`; document.querySelector('#tasks').innerHTML = table(['Task','Status','Agent','Error'], status.tasks.slice(-12).reverse().map((t) => [`<span class="mono">${esc(t.id)}</span>`,pill(t.status),esc(t.assignedAgentId ?? 'unassigned'),esc(t.error ?? '')])); document.querySelector('#events').innerHTML = table(['Time','Type','Execution','Task'], (events.events ?? []).slice(-12).reverse().map((e) => [esc(new Date(e.timestamp).toLocaleTimeString()),pill(e.type),esc(e.executionId ?? ''),esc(e.taskId ?? '')])); document.querySelector('#error').textContent = ''; } catch (error) { document.querySelector('#error').textContent = `Control-plane API unavailable: ${error.message}. Start the Helix API and set localStorage.HELIX_API when the dashboard is served separately.`; } }
    load(); setInterval(load, 5000);
  </script>
</body>
</html>
