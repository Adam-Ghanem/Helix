<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Helix Operations Console</title>
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Helix navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <strong>HELIX</strong>
          <span>Operations Console</span>
        </div>
      </div>
      <nav class="nav" id="navigation">
        <button class="nav-item active" type="button" data-view="overview">Overview</button>
        <button class="nav-item" type="button" data-view="executions">Executions</button>
        <button class="nav-item" type="button" data-view="agents">Agents</button>
        <button class="nav-item" type="button" data-view="approvals">Approvals</button>
        <button class="nav-item" type="button" data-view="telemetry">Telemetry</button>
        <button class="nav-item" type="button" data-view="events">Events</button>
      </nav>
      <div class="sidebar-footer">
        <span id="connection-dot" class="connection-dot" aria-hidden="true"></span>
        <div>
          <strong id="connection-label">Connecting</strong>
          <span id="sequence-label">Sequence 0</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Durable orchestration runtime</p>
          <h1 id="view-title">Overview</h1>
        </div>
        <div class="topbar-actions">
          <label class="token-field">
            <span>API token</span>
            <input id="api-token" type="password" autocomplete="off" spellcheck="false" placeholder="Memory only" aria-label="Helix API token" />
          </label>
          <button id="connect" class="button secondary" type="button">Reconnect</button>
          <button id="refresh" class="button" type="button">Refresh</button>
        </div>
      </header>

      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
